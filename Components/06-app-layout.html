<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/06-app-layout.css" />
    <title>App Layout</title>
  </head>
  <body>
    <div class="container">
      <aside class="side-nav">Nav</aside>
      <menu class="main-nav">
        <nav class="left-nav">
          <button class="btn btn--left-nav" type="button" title="new">
            New
          </button>
          <button class="btn btn--left-nav" type="button" title="Replay">
            Replay
          </button>
          <button class="btn btn--left-nav" type="button" title="Forward">
            Forward
          </button>
          <button
            class="btn btn--left-nav"
            type="button"
            title="Mark as unread"
          >
            Mark as unread
          </button>
        </nav>
        <nav class="right-nav">
          <button class="btn btn--right-nav" type="button" title="trash">
            Trash
          </button>
        </nav>
      </menu>
      <section class="email-list">
        <div class="email">Email 1</div>
        <div class="email">Email 2</div>
        <div class="email">Email 3</div>
        <div class="email">Email 4</div>
        <div class="email">Email 5</div>
        <div class="email">Email 6</div>
        <div class="email">Email 7</div>
        <div class="email">Email 8</div>
        <div class="email">Email 9</div>
        <div class="email">Email 10</div>
      </section>
      <section class="email-view">email-view</section>
      <section class="additional-info">additional-info</section>
    </div>
  </body>
</html>
